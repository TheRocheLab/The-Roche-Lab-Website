<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications | The Roche Lab</title>
    <style>
        /* CSS Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navigation Bar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #D9D9D9; /* Light grey matching Figma */
            padding: 1rem 5%;
            color: #1a1a1a;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar .logo {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -1px;
            display: flex;
            flex-direction: column;
            line-height: 0.9;
        }

        .navbar .logo span {
            font-size: 0.9rem;
            font-weight: normal;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 1.5rem;
        }

        .nav-links li a {
            color: #1a1a1a;
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .nav-links li a:hover {
            color: #2b60de;
        }

        /* Hero Section (Blue Banner) */
        .hero {
            background-color: #2b60de; /* Royal blue */
            color: white;
            padding: 5rem 5%;
            text-align: left; /* Aligned left as seen in the mobile viewport */
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            text-transform: capitalize;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 800px;
            font-weight: 400;
            line-height: 1.6;
        }

        /* Main Content */
        main {
            flex: 1; /* Pushes footer to the bottom */
        }

        /* Published Works Section (White Background) */
        .published-works {
            background-color: #ffffff;
            padding: 4rem 5%;
            text-align: right; /* Aligned right based on the cutoff text in the design */
        }

        .published-works h2 {
            font-size: 2.5rem;
            font-weight: 300;
            color: #1a1a1a;
            letter-spacing: 1px;
        }

        /* Coming Soon Section (Beige Background) */
        .coming-soon {
            background-color: #f0f0e6; /* Beige/light green color from the design */
            padding: 6rem 5%;
            text-align: right; /* Aligned right to match the layout flow */
        }

        .coming-soon h2 {
            font-size: 3rem;
            font-weight: 800;
            color: #1a1a1a;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Footer */
        footer {
            background-color: #1a1a1a;
            color: #fff;
            text-align: center;
            padding: 2rem 5%;
            font-size: 0.9rem;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 1rem;
                padding: 1.5rem;
                align-items: flex-start;
            }
            .nav-links {
                flex-wrap: wrap;
                justify-content: flex-start;
            }
            .hero h1 {
                font-size: 2.8rem;
            }
            .hero p {
                font-size: 1.1rem;
            }
            .published-works h2, .coming-soon h2 {
                text-align: center; /* Center on smaller screens for better readability */
            }
            .coming-soon h2 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">
           <img src="logo.svg" alt="The Roche Lab Logo" style="height: 45px; width: auto;">
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
    <li><a href="research.html">Research</a></li>
    <li><a href="people.html">People</a></li>
    <li><a href="news.html">News</a></li>
    <li><a href="publication.html">Publications</a></li>
    <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <header class="hero">
        <h1>Publications</h1>
        <p>Our research contributions to the field of synaptic neuroscience and molecular neurobiology</p>
    </header>

    <main>
        <section class="published-works">
            <h2>Published Works</h2>
        </section>

        <section class="coming-soon">
            <h2>COMING SOON</h2>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 The Roche Lab. All rights reserved.</p>
    </footer>

</body>
</html>
