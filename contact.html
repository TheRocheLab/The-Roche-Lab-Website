<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | The Roche Lab</title>
    <style>
        /* CSS Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navigation Bar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #e6e6e6; /* Light grey */
            padding: 1.5rem 5%;
            color: #1a1a1a;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* Exact Logo Styling */
        .logo {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: #1a1a1a;
        }

        .logo-main {
            font-size: 3rem;
            font-weight: 900; 
            line-height: 0.8;
            letter-spacing: -2px; 
        }

        .logo-sub {
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 6px;
        }

        /* Desktop Navigation Links */
        .nav-links {
            list-style: none;
            display: flex;
            gap: 1.5rem;
        }

        .nav-links li a {
            color: #1a1a1a;
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .nav-links li a:hover {
            color: #2b60de;
        }

        /* Hero Section (Blue Banner) */
        .hero {
            background-color: #2b60de; /* Royal blue */
            color: white;
            padding: 4rem 5% 6rem 5%;
            text-align: left;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            line-height: 1.1;
        }

        .hero p {
            font-size: 1.25rem;
            max-width: 800px;
            font-weight: 400;
            line-height: 1.5;
        }

        /* Main Content area */
        main {
            flex: 1; 
            display: flex;
            flex-direction: column;
        }

        /* White Spacer Block */
        .white-spacer {
            background-color: #ffffff;
            height: 80px; 
            width: 100%;
        }

        /* Coming Soon Section (Beige Background) */
        .coming-soon {
            background-color: #f0f0e6; /* Beige color */
            padding: 6rem 5%;
            flex-grow: 1; 
            display: flex;
            justify-content: flex-end; 
            align-items: center;
        }

        .coming-soon h2 {
            font-size: 3.5rem;
            font-weight: 400; 
            color: #1a1a1a;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: "Times New Roman", Times, serif; 
        }

        /* Footer */
        footer {
            background-color: #1a1a1a;
            color: #fff;
            text-align: center;
            padding: 2rem 5%;
            font-size: 0.9rem;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: flex-start;
                padding: 1rem 1.5rem;
            }
            
            .nav-links {
                display: none; 
            }

            .hero {
                padding: 3rem 1.5rem 4rem 1.5rem;
            }

            .hero h1 {
                font-size: 3rem;
                margin-bottom: 1rem;
            }
            
            .hero p {
                font-size: 1.1rem;
            }
            
            .coming-soon h2 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">
             <img src="logo.svg" alt="The Roche Lab Logo" style="height: 45px; width: auto;">
        </a>
        
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
    <li><a href="research.html">Research</a></li>
    <li><a href="people.html">People</a></li>
    <li><a href="news.html">News</a></li>
    <li><a href="publication.html">Publications</a></li>
    <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <header class="hero">
        <h1>Contact & Get Involved</h1>
        <p>Interested in joining our lab or learning more about our research? feel free to reach out, we'd love to hear from you!</p>
    </header>

    <main>
        <div class="white-spacer"></div>

        <section class="coming-soon">
            <h2>COMING SOON</h2>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 The Roche Lab. All rights reserved.</p>
    </footer>

</body>
</html>
