<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | The Roche Lab</title>
    <style>
        /* CSS Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navigation Bar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #D9D9D9; 
            padding: 1rem 5%;
            color: #1a1a1a;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: #1a1a1a;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 1.5rem;
        }

        .nav-links li a {
            color: #1a1a1a;
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .nav-links li a:hover {
            color: #2b60de;
        }

        /* Hero Section (Blue Banner) */
        .hero {
            background-color: #2b60de; 
            color: white;
            padding: 4rem 5% 6rem 5%;
            text-align: left;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 2rem;
        }

        .hero p {
            font-size: 1.25rem;
            max-width: 800px;
            font-weight: 400;
            line-height: 1.5;
        }

        /* Main Content area */
        main {
            flex: 1; 
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
        }

        /* White Spacer Block */
        .white-spacer {
            background-color: #ffffff;
            height: 60px; 
            width: 100%;
        }

        /* Contact Details Grid Layout - Image brought closer to text */
        .contact-container {
            max-width: 1100px;
            width: 90%;
            margin: 0 auto 5rem auto;
            display: grid;
            grid-template-columns: 1.2fr 1fr; /* Gives the text section slightly more room */
            gap: 2rem; /* Reduced from 4rem to pull the image closer */
            align-items: flex-start;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
        }

        .location-title {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            color: #2b60de;
            margin-bottom: 0.5rem;
        }

        .address-text {
            font-size: 1.3rem;
            color: #1a1a1a;
            font-weight: 500;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .email-info {
            font-size: 1.2rem;
            color: #333333;
            font-weight: 500;
            border-top: 1px solid #f0f0f0;
            padding-top: 1.5rem;
        }

        .email-info a {
            color: #2b60de;
            text-decoration: none;
            font-weight: 600;
        }

        .email-info a:hover {
            text-decoration: underline;
        }

        /* Contact Image Styling */
        .contact-image-wrap {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            background-color: #f9f9f9;
        }

        .contact-image-wrap img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* Footer */
        footer {
            background-color: #1a1a1a;
            color: #fff;
            text-align: center;
            padding: 2rem 5%;
            font-size: 0.9rem;
        }

        /* Mobile Responsiveness Rules */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: flex-start;
                padding: 1rem 1.5rem;
            }

            .nav-links {
                display: none; 
            }

            .hero h1 {
                font-size: 2.8rem;
                margin-bottom: 1.5rem;
